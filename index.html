<!doctype html>
<html lang="en" data-theme="teal">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set the saved look before first paint so the page never flashes the wrong one.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('folio.theme') === 'blue' ? 'blue' : 'teal'
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A photographer platform: portfolio, social profile, and client booking in one place."
    />
    <meta name="theme-color" content="#011411" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23044E3B'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23FBCFE8' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23FBCFE8'/%3E%3C/svg%3E"
    />
    <title>Folio — Photography</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
